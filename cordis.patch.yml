# DeepSeek Harness - Task Dispatcher & Acceptance Verifier
# Provider-aware subagent delegation and automated acceptance verification.
- insert:
    - id: dsh-subagent-dispatcher
      name: dsh-subagent-dispatcher
      config:
        toolName: dispatch_task
        defaultReasoningEffort: low
        defaultProvider: ""
        defaultModel: ""
        maxRounds: 3
        maxResultChars: 16384
        autoVerifyFiles: true
        subagentProvider: spawn
